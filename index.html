<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Points Card</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1d1d1f;--mut:#777;--ac:#b3261e;--line:#e6e0d6}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--tx:#f2f2f2;--mut:#999;--ac:#ff6b5e;--line:#333}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:480px;margin:auto}
h1{font-size:22px;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
input,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin-bottom:8px}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
label{font-size:13px;color:var(--mut);display:block;margin:4px 0}
.big{font-size:44px;font-weight:700;color:var(--ac);line-height:1.1;margin-top:6px}
.big small{font-size:16px;color:var(--mut);font-weight:400}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
.msg{min-height:20px;font-size:14px;color:var(--mut)}
.msg.err{color:var(--ac)}
.small{font-size:12px;color:var(--mut);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.btn{display:block;text-align:center;padding:12px;border-radius:10px;background:#25D366;color:#fff;font-weight:600;text-decoration:none;margin-top:8px}
.hide{display:none}
</style>
</head>
<body>
<h1 id="title" style="margin-bottom:2px"></h1>
<div class="small" id="place" style="margin:0 0 14px"></div>

<!-- Customer -->
<div id="cust">
  <div class="card">
    <input id="cp" type="tel" inputmode="numeric" maxlength="10" placeholder="Apna 10 digit mobile number">
    <button onclick="check()">Card dekho / banao</button>
    <div id="cmsg" class="msg"></div>
  </div>

  <div id="reg" class="card hide">
    <div style="font-weight:600;margin-bottom:8px">Pehli baar aaye hain? Apna card banayein</div>
    <input id="rn" placeholder="Aapka naam" maxlength="40">
    <label for="rd">Janmdin (zaroori nahi)</label>
    <input id="rd" type="date">
    <button onclick="register()">Card banao</button>
    <div class="small">Aapka number sirf rewards aur offers ke liye use hoga, kisi aur ko nahi diya jayega.</div>
  </div>

  <div id="ccard" class="card hide">
    <div id="cname" style="font-weight:600"></div>
    <div class="big"><span id="cpts">0</span> <small>points</small></div>
    <div class="bar"><i id="cbar"></i></div>
    <div id="cinfo" class="msg"></div>
    <button class="alt" onclick="resetPhone()">Dusra number</button>
  </div>
</div>

<!-- Owner -->
<div id="own" class="hide">
  <div class="card">
    <input id="pin" type="password" inputmode="numeric" placeholder="Owner PIN">
    <input id="op" type="tel" inputmode="numeric" maxlength="10" placeholder="Customer ka mobile number">
    <input id="on" placeholder="Naam (naya customer ho to)">
    <input id="opts" type="number" inputmode="numeric" min="1" placeholder="Kitne points?">
    <input id="onote" placeholder="Kya liya / note (zaroori nahi)" maxlength="40">
    <button onclick="act('add')">+ Points do</button>
    <button class="alt" onclick="act('use')">Points use karo (kaato)</button>
    <button class="alt" onclick="list()">Saare customers</button>
    <div id="omsg" class="msg"></div>
    <a id="wa" class="btn hide" target="_blank" rel="noopener">WhatsApp par message bhejo</a>
    <div class="bar"><i id="obar"></i></div>
  </div>
  <div id="tbl" class="card hide" style="overflow-x:auto"></div>
</div>

<script>
const SHOP = 'Khushi Store';
const PLACE = 'Biru, Simdega';
const API = 'https://script.google.com/macros/s/AKfycbz500i7vD9Mo1odGghsTES7uLqEHVMHuENz_67907b_Wh5xPadS-IvPGDeMeRuXtYE/exec';
const isOwner = new URLSearchParams(location.search).has('owner');
const $ = id => document.getElementById(id);

async function call(params){
  const r = await fetch(API + '?' + new URLSearchParams(params));
  return r.json();
}
function setBar(el, pts, goal){ el.style.width = Math.min(100, Math.round(pts / goal * 100)) + '%'; }
function say(el, t, err){ el.textContent = t; el.className = 'msg' + (err ? ' err' : ''); }
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function check(){
  say($('cmsg'), 'Dekh rahe hain...');
  try{
    const d = await call({action:'status', phone:$('cp').value});
    if(d.error){ say($('cmsg'), d.error, true); return; }
    say($('cmsg'), '');
    try{ localStorage.setItem('cphone', d.phone); }catch(e){}
    $('ccard').classList.remove('hide');
    $('reg').classList.toggle('hide', !!d.name);
    $('cname').textContent = d.name ? 'Namaste, ' + d.name : 'Aapka card';
    $('cpts').textContent = d.points;
    setBar($('cbar'), d.points, d.goal);
    $('cinfo').textContent = d.points < d.goal
      ? d.goal - d.points + ' aur points par ' + d.reward + '.'
      : 'Badhai! ' + d.reward + ' ke liye points poore ho gaye. Dukan par dikhao.';
  }catch(e){ say($('cmsg'), 'Connection error', true); }
}

async function register(){
  const name = $('rn').value.trim();
  if(!name){ say($('cmsg'), 'Naam likhein', true); return; }
  say($('cmsg'), 'Card ban raha hai...');
  try{
    const d = await call({action:'register', phone:$('cp').value, name:name, dob:$('rd').value});
    if(d.error){ say($('cmsg'), d.error, true); return; }
    await check();
  }catch(e){ say($('cmsg'), 'Connection error', true); }
}

function resetPhone(){
  try{ localStorage.removeItem('cphone'); }catch(e){}
  $('cp').value = '';
  $('ccard').classList.add('hide');
  $('reg').classList.add('hide');
  say($('cmsg'), '');
}

async function act(action){
  say($('omsg'), 'Ruko...');
  $('wa').classList.add('hide');
  try{
    const d = await call({action, phone:$('op').value, name:$('on').value, pts:$('opts').value, note:$('onote').value, pin:$('pin').value});
    localStorage.setItem('pin', $('pin').value);
    if(d.error){ say($('omsg'), d.error, true); if(d.points != null) setBar($('obar'), d.points, d.goal); return; }
    setBar($('obar'), d.points, d.goal);
    say($('omsg'), (d.name || d.phone) + ': ' + d.points + ' points abhi hain (kul use hue: ' + d.used + ')');
    const pts = $('opts').value;
    let msg = 'Namaste ' + (d.name ? d.name + ' ji' : 'ji') + ', ' + SHOP + ' (' + PLACE + ') me ';
    msg += action === 'add' ? 'aapke ' + pts + ' points jude.' : 'aapne ' + pts + ' points use kiye.';
    msg += ' Ab aapke ' + d.points + ' points hain. ';
    msg += d.points >= d.goal ? d.reward + ' claim karne ke liye dukan par aayein!' : (d.goal - d.points) + ' aur points par ' + d.reward + ' milega!';
    msg += ' Apna card dekhein: ' + location.origin + location.pathname;
    $('wa').href = 'https://wa.me/91' + d.phone + '?text=' + encodeURIComponent(msg);
    $('wa').classList.remove('hide');
    $('opts').value = ''; $('onote').value = '';
  }catch(e){ say($('omsg'), 'Connection error', true); }
}

async function list(){
  try{
    const d = await call({action:'list', pin:$('pin').value});
    if(d.error){ say($('omsg'), d.error, true); return; }
    let h = '<table><tr><th>Naam</th><th>Number</th><th>Points</th><th>Use hue</th><th>Janmdin</th></tr>';
    d.rows.forEach(r => { h += '<tr><td>' + esc(r[1]) + '</td><td>' + esc(r[0]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td><td>' + esc(r[5] || '') + '</td></tr>'; });
    $('tbl').innerHTML = h + '</table>';
    $('tbl').classList.remove('hide');
    say($('omsg'), d.rows.length + ' customers');
  }catch(e){ say($('omsg'), 'Connection error', true); }
}

document.title = SHOP;
$('place').textContent = PLACE;
if(isOwner){
  $('cust').classList.add('hide'); $('own').classList.remove('hide');
  $('title').textContent = SHOP + ' - Owner';
  try{ $('pin').value = localStorage.getItem('pin') || ''; }catch(e){}
} else {
  $('title').textContent = SHOP;
  let saved = '';
  try{ saved = localStorage.getItem('cphone') || ''; }catch(e){}
  if(saved){ $('cp').value = saved; check(); }
}
</script>
</body>
</html>
